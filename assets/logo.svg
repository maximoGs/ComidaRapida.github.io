<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y glow -->
    <filter id="fastFoodShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff385c" flood-opacity="0.7"/>
    </filter>

    <!-- Gradientes -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="bunGradTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b2718"/>
      <stop offset="100%" stop-color="#3d140e"/>
    </linearGradient>

    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Rutas de texto circular -->
    <path id="circleTextTop" d="M 85,250 A 165,165 0 0,1 415,250" fill="none"/>
    <path id="circleTextBottom" d="M 415,250 A 165,165 0 0,1 85,250" fill="none"/>
  </defs>

  <!-- Borde exterior rojo intenso y redondeado con sombra -->
  <circle cx="250" cy="250" r="238" fill="#120c0e" stroke="url(#redGradient)" stroke-width="8" filter="url(#fastFoodShadow)"/>
  
  <!-- Anillo decorativo dorado / queso caliente -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-dasharray="8 6"/>

  <!-- Anillo medio rojo fuego -->
  <circle cx="250" cy="250" r="206" fill="#e11d48" stroke="#120c0e" stroke-width="4"/>

  <!-- Círculo central oscuro / carbón de parrilla -->
  <circle cx="250" cy="250" r="142" fill="#181114" stroke="url(#goldGradient)" stroke-width="4.5"/>

  <!-- Puntos y estrellas decorativas -->
  <circle cx="68" cy="250" r="6" fill="#f59e0b"/>
  <circle cx="432" cy="250" r="6" fill="#f59e0b"/>

  <!-- Texto Arqueado Superior: FUEGO BURGER -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="7">
    <textPath href="#circleTextTop" startOffset="50%" text-anchor="middle">
      FUEGO BURGER
    </textPath>
  </text>

  <!-- Texto Arqueado Inferior: FAST FOOD &amp; GRILL -->
  <text fill="#fef08a" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="22" letter-spacing="6">
    <textPath href="#circleTextBottom" startOffset="50%" text-anchor="middle">
      ★ FAST FOOD &amp; GRILL ★
    </textPath>
  </text>

  <!-- Gráfico Central: Hamburguesa Gourmet & Llamas de Fuego -->
  <g transform="translate(250, 248) scale(0.92)">
    <!-- Llamas de fondo sutiles -->
    <path d="M -45,-30 Q -65,-75 -35,-95 Q -20,-75 0,-105 Q 20,-75 35,-95 Q 65,-75 45,-30 Z" fill="url(#goldGradient)" opacity="0.35" filter="url(#flameGlow)"/>
    <path d="M -30,-25 Q -45,-60 -20,-75 Q -10,-55 0,-85 Q 10,-55 20,-75 Q 45,-60 30,-25 Z" fill="#e11d48" opacity="0.5"/>

    <!-- Pan Superior (Brioche Bun) -->
    <path d="M -80,-15 C -80,-75 80,-75 80,-15 C 80,-10 -80,-10 -80,-15 Z" fill="url(#bunGradTop)" stroke="#92400e" stroke-width="3"/>
    
    <!-- Semillas de Sésamo en el Pan -->
    <ellipse cx="-45" cy="-45" rx="3.5" ry="2" fill="#fffbeb" transform="rotate(-15 -45 -45)"/>
    <ellipse cx="-20" cy="-60" rx="3.5" ry="2" fill="#fffbeb" transform="rotate(5 -20 -60)"/>
    <ellipse cx="15" cy="-58" rx="3.5" ry="2" fill="#fffbeb" transform="rotate(-10 15 -58)"/>
    <ellipse cx="45" cy="-42" rx="3.5" ry="2" fill="#fffbeb" transform="rotate(20 45 -42)"/>
    <ellipse cx="-5" cy="-38" rx="3.5" ry="2" fill="#fffbeb" transform="rotate(-5 -5 -38)"/>
    <ellipse cx="-60" cy="-28" rx="3.5" ry="2" fill="#fffbeb" transform="rotate(25 -60 -28)"/>
    <ellipse cx="60" cy="-25" rx="3.5" ry="2" fill="#fffbeb" transform="rotate(-25 60 -25)"/>

    <!-- Lechuga Crujiente Rizada -->
    <path d="M -85,-10 Q -70,2 -55,-8 Q -40,4 -25,-8 Q -10,4 5,-8 Q 20,4 35,-8 Q 50,4 65,-8 Q 75,2 85,-10 L 80,-5 Q 65,8 50,-2 Q 35,8 20,-2 Q 5,8 -10,-2 Q -25,8 -40,-2 Q -55,8 -70,-2 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>

    <!-- Rodajas de Tomate Rojo -->
    <rect x="-75" y="-5" width="150" height="8" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>

    <!-- Queso Cheddar Fundido Chorreante -->
    <path d="M -82,2 L 82,2 L 75,18 L 50,14 L 30,28 L 10,14 L -15,26 L -35,14 L -60,24 L -75,14 Z" fill="url(#cheeseGrad)" stroke="#d97706" stroke-width="2"/>

    <!-- Medallón de Carne Smash 1 (Parrilla) -->
    <rect x="-84" y="10" width="168" height="18" rx="7" fill="url(#pattyGrad)" stroke="#260c07" stroke-width="2.5"/>

    <!-- Segundo Queso Cheddar Fundido -->
    <path d="M -80,24 L 80,24 L 65,34 L 40,28 L 15,36 L -10,27 L -35,35 L -65,27 Z" fill="url(#cheeseGrad)" stroke="#d97706" stroke-width="1.8"/>

    <!-- Medallón de Carne Smash 2 -->
    <rect x="-82" y="27" width="164" height="18" rx="7" fill="url(#pattyGrad)" stroke="#260c07" stroke-width="2.5"/>

    <!-- Pan Inferior -->
    <path d="M -78,44 C -78,44 78,44 78,44 C 78,64 -78,64 -78,44 Z" fill="url(#bunGradTop)" stroke="#92400e" stroke-width="3"/>
  </g>
</svg>
